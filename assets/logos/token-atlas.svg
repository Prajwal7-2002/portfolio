<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4" />

  <!-- Latitude/Longitude Grid Rings -->
  <g opacity="0.3">
    <circle cx="256" cy="256" r="140" fill="none" stroke="#22d3ee" stroke-width="2" stroke-dasharray="6,6" />
    <ellipse cx="256" cy="256" rx="140" ry="60" fill="none" stroke="#34d399" stroke-width="2" />
    <line x1="256" y1="96" x2="256" y2="416" stroke="#22d3ee" stroke-width="2" stroke-dasharray="4,4" />
    <line x1="96" y1="256" x2="416" y2="256" stroke="#34d399" stroke-width="2" stroke-dasharray="4,4" />
  </g>

  <!-- Central Glowing Token Pillar -->
  <g transform="translate(166, 166)">
    <rect x="0" y="0" width="180" height="180" rx="24" fill="#083344" stroke="url(#cyanGrad)" stroke-width="3" filter="url(#glow)" />
    <!-- Multilingual glyphs -->
    <text x="90" y="70" fill="#22d3ee" font-family="'JetBrains Mono', Consolas, monospace" font-size="28" font-weight="800" text-anchor="middle">52 LANG</text>
    <text x="90" y="105" fill="#34d399" font-family="'JetBrains Mono', Consolas, monospace" font-size="16" font-weight="700" text-anchor="middle">ATLAS</text>
    <rect x="30" y="125" width="120" height="24" rx="6" fill="#155e75" />
    <text x="90" y="141" fill="#ecfeff" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="700" text-anchor="middle">FERTILITY TAX</text>
  </g>
</svg>
